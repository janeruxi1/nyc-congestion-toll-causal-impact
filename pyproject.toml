[project]
name = "congestion"
version = "0.1.0"
description = "Did New York's congestion toll change taxi and Uber/Lyft trips? Difference-in-differences, forecasting and synthetic control on 1.3 billion TLC trips"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]
"notebooks/*.ipynb" = ["E402"]
